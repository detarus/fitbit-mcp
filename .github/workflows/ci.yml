name: CI
on:
  push:
    branches: [main, work/alpha]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build, typecheck and test
        run: pnpm check
      - name: Demo smoke check
        run: node dist/cli.js demo-check
      - name: Install packed artifact outside the repository and test it
        run: node scripts/package-smoke.mjs
      - name: Upload tested package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: '*.tgz'
  client-config:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DISABLE_AUTOUPDATER: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install pinned official client CLIs
        run: npm install --global --no-audit --no-fund @openai/codex@0.163.0 @anthropic-ai/claude-code@2.1.302
      - name: Verify actual client executables
        run: |
          codex --version
          claude --version
          claude mcp add --help
      - name: Install MCP and shared skills for both clients, including repeat installation
        run: node scripts/client-smoke.mjs
      - name: Validate Claude plugin with the actual CLI
        run: npm exec --yes --package=@anthropic-ai/claude-code@2.1.302 -- claude plugin validate . --strict
      - name: Register the demo MCP with actual Codex CLI
        shell: bash
        run: |
          npm exec --yes --package=@openai/codex@0.163.0 -- codex mcp add fitbit-ci -- node "$PWD/dist/cli.js" serve --demo
          npm exec --yes --package=@openai/codex@0.163.0 -- codex mcp get fitbit-ci --json
  prerelease:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, client-config]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: package-ubuntu-latest
          path: release-assets
      - name: Publish tested alpha package and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs
